<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183D3E">
  <title>Red de Bibliotecas · Inicio</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="root">
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegación principal">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <div><strong>Red de<br>Bibliotecas</strong><small>Sistema de circulación</small></div>
        </div>
      </aside>
      <div class="workspace">
        <main tabindex="-1">
          <div class="table-message" role="status">Cargando interfaz React de la Red de Bibliotecas…</div>
        </main>
      </div>
    </div>
  </div>

  <!-- React 18 + ReactDOM 18 + Babel para compilar los componentes JSX en el navegador -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <!-- Módulos, Componentes y Vistas React servidos directamente desde /src -->
  <script type="text/babel" src="/src/constantes.js"></script>
  <script type="text/babel" src="/src/api.js"></script>
  <script type="text/babel" src="/src/components/UI.jsx"></script>
  <script type="text/babel" src="/src/components/TablaDatos.jsx"></script>
  <script type="text/babel" src="/src/components/ModalDialogo.jsx"></script>
  <script type="text/babel" src="/src/views/VistaInicio.jsx"></script>
  <script type="text/babel" src="/src/views/VistaPrestamos.jsx"></script>
  <script type="text/babel" src="/src/views/VistaRemitos.jsx"></script>
  <script type="text/babel" src="/src/views/VistaCatalogo.jsx"></script>
  <script type="text/babel" src="/src/views/VistaReservas.jsx"></script>
  <script type="text/babel" src="/src/views/VistaSocios.jsx"></script>
  <script type="text/babel" src="/src/views/VistaSedes.jsx"></script>
  <script type="text/babel" src="/src/views/VistaMultas.jsx"></script>
  <script type="text/babel" src="/src/views/VistaReportes.jsx"></script>
  <script type="text/babel" src="/src/App.jsx"></script>
</body>
</html>
